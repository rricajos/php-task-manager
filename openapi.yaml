openapi: 3.0.3
info:
  title: Gestor de Tareas API
  description: |
    API REST para gestionar tareas con autenticación JWT.
    Parte del proyecto de estudio PHP 8.3 de [rricajos](https://github.com/rricajos/php).

    ## Autenticación
    Todas las rutas `/tasks` requieren un token JWT en el header `Authorization: Bearer <token>`.
    Obtén un token registrándote y haciendo login en `/auth`.

    ## Aislamiento de datos
    Cada usuario solo puede ver y gestionar sus propias tareas. El `user_id` se extrae
    automáticamente del token JWT en cada petición autenticada.

    ## Paginación
    Los endpoints que retornan listas soportan paginación con los parámetros `page` y `per_page`.
    La respuesta incluye un objeto `pagination` con metadatos: `total`, `page`, `per_page`, `total_pages`.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Ricard Penin Honrubia
    url: https://github.com/rricajos

servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo

tags:
  - name: Auth
    description: Registro, autenticación de usuarios y perfil
  - name: Tasks
    description: Operaciones CRUD sobre tareas con paginación y filtros
  - name: Export
    description: Exportación y estadísticas

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Registrar un nuevo usuario
      description: |
        Crea una nueva cuenta de usuario. El nombre de usuario debe ser único,
        alfanumérico (con guiones bajos), entre 3 y 50 caracteres.
        La contraseña debe tener al menos 6 caracteres.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-zA-Z0-9_]+$'
                  example: admin
                password:
                  type: string
                  minLength: 6
                  example: secret123
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRegisterResponse'
        '409':
          description: El nombre de usuario ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Iniciar sesión y obtener token JWT
      description: |
        Autentica un usuario con sus credenciales y retorna un token JWT
        firmado con HMAC-SHA256. El token tiene una duración de 24 horas
        por defecto (configurable via JWT_TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getUserProfile
      summary: Obtener perfil del usuario autenticado
      description: |
        Retorna los datos del perfil del usuario autenticado.
        El user_id se extrae del token JWT.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: Listar tareas con paginación, ordenamiento y filtros
      description: |
        Retorna las tareas del usuario autenticado con soporte para
        paginación, ordenamiento por cualquier campo y filtros por
        estado y prioridad. Solo retorna tareas del user_id del token JWT.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pendiente, completada, todas]
            default: todas
          description: Filtrar por estado de la tarea
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [alta, media, baja]
          description: Filtrar por prioridad de la tarea
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número de página
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Resultados por página (máximo 100)
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [fecha_creacion, titulo, prioridad, estado, fecha_vencimiento]
            default: fecha_creacion
          description: Campo por el cual ordenar
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Dirección de ordenamiento
      responses:
        '200':
          description: Lista paginada de tareas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    post:
      tags: [Tasks]
      operationId: createTask
      summary: Crear una nueva tarea
      description: |
        Crea una nueva tarea asociada al usuario autenticado.
        El título es obligatorio (máximo 100 caracteres). La prioridad
        por defecto es 'media'. La fecha de vencimiento es opcional
        y debe tener formato YYYY-MM-DD.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 100
                  description: Título de la tarea (obligatorio)
                  example: Estudiar PHP 8
                description:
                  type: string
                  description: Descripción detallada de la tarea
                  example: Repasar enums y match
                priority:
                  type: string
                  enum: [alta, media, baja]
                  default: media
                  description: Nivel de prioridad
                  example: alta
                due_date:
                  type: string
                  format: date
                  description: Fecha de vencimiento en formato YYYY-MM-DD
                  example: '2026-12-31'
      responses:
        '201':
          description: Tarea creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/{id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Obtener una tarea por ID
      description: |
        Retorna los detalles de una tarea específica. Solo se puede
        acceder a tareas del usuario autenticado.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Tarea encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    put:
      tags: [Tasks]
      operationId: updateTask
      summary: Actualizar una tarea existente
      description: |
        Actualiza los campos especificados de una tarea existente.
        Solo se actualizan los campos incluidos en el body; los campos
        omitidos mantienen su valor actual. Para eliminar la fecha de
        vencimiento, enviar due_date como cadena vacía.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                  description: Nuevo título
                  example: Estudiar PHP 8.3
                description:
                  type: string
                  description: Nueva descripción
                  example: Repasar readonly properties y fibers
                priority:
                  type: string
                  enum: [alta, media, baja]
                  description: Nueva prioridad
                  example: media
                due_date:
                  type: string
                  format: date
                  description: Nueva fecha de vencimiento (YYYY-MM-DD, cadena vacía para eliminar)
                  example: '2026-12-31'
      responses:
        '200':
          description: Tarea actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Eliminar una tarea permanentemente
      description: |
        Elimina una tarea de forma permanente. Esta acción no se puede deshacer.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Tarea eliminada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/{id}/complete:
    patch:
      tags: [Tasks]
      operationId: completeTask
      summary: Marcar tarea como completada
      description: |
        Marca una tarea pendiente como completada y registra la fecha de
        completado. Si la tarea ya está completada, retorna error 422.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Tarea marcada como completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: La tarea ya está completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/search:
    get:
      tags: [Tasks]
      operationId: searchTasks
      summary: Buscar tareas por palabra clave con paginación
      description: |
        Busca tareas cuyo título o descripción contengan la palabra clave.
        Soporta paginación. Solo busca en las tareas del usuario autenticado.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Palabra clave a buscar en título y descripción
          example: PHP
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número de página
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Resultados por página (máximo 100)
      responses:
        '200':
          description: Resultados de búsqueda paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/stats:
    get:
      tags: [Export]
      operationId: getTaskStats
      summary: Obtener estadísticas de tareas
      description: |
        Retorna estadísticas de las tareas del usuario autenticado:
        totales, desglose por estado, desglose por prioridad y
        porcentaje de completado.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estadísticas obtenidas exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/export:
    get:
      tags: [Export]
      operationId: exportTasks
      summary: Exportar tareas como descarga directa
      description: |
        Exporta todas las tareas del usuario autenticado en el formato
        especificado. El contenido se envía directamente como descarga
        (streaming), no como referencia a un archivo.

        - **JSON**: Content-Type `application/json` con estructura que incluye
          metadatos de exportación y lista de tareas.
        - **CSV**: Content-Type `text/csv` con BOM UTF-8 para compatibilidad
          con Excel, encabezados de columna y una fila por tarea.

        Ambos formatos incluyen header `Content-Disposition: attachment`.
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: Formato de exportación
      responses:
        '200':
          description: Contenido exportado como descarga directa
          content:
            application/json:
              description: Exportación en formato JSON
              schema:
                type: object
                properties:
                  exportado_en:
                    type: string
                    format: date-time
                    description: Fecha y hora de exportación
                  total_tareas:
                    type: integer
                    description: Número total de tareas exportadas
                  tareas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
            text/csv:
              description: Exportación en formato CSV
              schema:
                type: string
                description: Contenido CSV con BOM UTF-8 y encabezados
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT obtenido del endpoint /auth/login.
        Formato del header: `Authorization: Bearer <token>`

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID único de la tarea (entero positivo)

  schemas:
    Task:
      type: object
      description: Representación completa de una tarea
      properties:
        id:
          type: integer
          description: Identificador único
          example: 1
        titulo:
          type: string
          description: Título de la tarea
          example: Estudiar PHP 8
        descripcion:
          type: string
          description: Descripción detallada
          example: Repasar enums y match
        prioridad:
          type: string
          enum: [alta, media, baja]
          description: Nivel de prioridad
          example: alta
        estado:
          type: string
          enum: [pendiente, completada]
          description: Estado actual
          example: pendiente
        fecha_creacion:
          type: string
          format: date-time
          description: Fecha y hora de creación
          example: '2026-05-27 10:30:00'
        fecha_completada:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora de completado (null si pendiente)
          example: null
        fecha_vencimiento:
          type: string
          format: date
          nullable: true
          description: Fecha límite en formato YYYY-MM-DD (null si no tiene)
          example: '2026-12-31'

    Pagination:
      type: object
      description: Metadatos de paginación
      properties:
        total:
          type: integer
          description: Número total de registros que coinciden con los filtros
          example: 45
        page:
          type: integer
          description: Página actual
          example: 1
        per_page:
          type: integer
          description: Registros por página
          example: 20
        total_pages:
          type: integer
          description: Número total de páginas
          example: 3

    SuccessResponse:
      type: object
      description: Respuesta exitosa genérica
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operación exitosa
        data:
          nullable: true

    TaskResponse:
      type: object
      description: Respuesta exitosa con una tarea
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Tarea obtenida exitosamente
        data:
          $ref: '#/components/schemas/Task'

    TaskPaginatedResponse:
      type: object
      description: Respuesta paginada con lista de tareas
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Tareas obtenidas exitosamente
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        pagination:
          $ref: '#/components/schemas/Pagination'

    StatsResponse:
      type: object
      description: Respuesta con estadísticas de tareas
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Estadisticas obtenidas exitosamente
        data:
          type: object
          properties:
            total:
              type: integer
              description: Número total de tareas
              example: 10
            completadas:
              type: integer
              description: Tareas completadas
              example: 4
            pendientes:
              type: integer
              description: Tareas pendientes
              example: 6
            por_prioridad:
              type: object
              description: Desglose por nivel de prioridad
              properties:
                alta:
                  type: integer
                  example: 3
                media:
                  type: integer
                  example: 5
                baja:
                  type: integer
                  example: 2
            porcentaje_completado:
              type: number
              format: float
              description: Porcentaje de tareas completadas
              example: 40.0

    UserProfileResponse:
      type: object
      description: Respuesta con datos del perfil de usuario
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Perfil obtenido exitosamente
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            username:
              type: string
              example: admin
            created_at:
              type: string
              format: date-time
              example: '2026-05-27 10:00:00'

    AuthRegisterResponse:
      type: object
      description: Respuesta de registro exitoso
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Usuario registrado exitosamente
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            username:
              type: string
              example: admin
            created_at:
              type: string
              format: date-time
              example: '2026-05-27 10:00:00'

    AuthLoginResponse:
      type: object
      description: Respuesta de login exitoso con token JWT
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login exitoso
        data:
          type: object
          properties:
            token:
              type: string
              description: Token JWT firmado con HMAC-SHA256
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            type:
              type: string
              description: Tipo de token (siempre Bearer)
              example: Bearer
            expires_in:
              type: integer
              description: Duración del token en segundos
              example: 86400
            user:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                username:
                  type: string
                  example: admin

    Error:
      type: object
      description: Respuesta de error
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Mensaje descriptivo del error
          example: Recurso no encontrado
        errors:
          type: object
          nullable: true
          description: Detalles adicionales del error (opcional)
          properties:
            campo:
              type: string
              description: Campo que causó el error de validación

  responses:
    Unauthorized:
      description: Token JWT faltante, inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Error de validación en los datos de entrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
