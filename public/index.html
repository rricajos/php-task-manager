<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header id="header" class="header hidden">
    <div class="header-inner">
        <h1 class="logo">Task Manager</h1>
        <nav class="header-nav">
            <span id="header-user" class="header-user"></span>
            <button id="btn-logout" class="btn btn-sm btn-outline" type="button">Logout</button>
        </nav>
    </div>
</header>

<main id="app"></main>

<!-- Task Modal -->
<div id="task-modal" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-title">New Task</h2>
            <button id="modal-close" class="btn-icon" type="button" aria-label="Close">&times;</button>
        </div>
        <form id="task-form" class="modal-body">
            <div class="form-group">
                <label for="task-title">Title <span class="required">*</span></label>
                <input type="text" id="task-title" name="title" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="task-description">Description</label>
                <textarea id="task-description" name="description" rows="3"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority" name="priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-due-date">Due Date</label>
                    <input type="date" id="task-due-date" name="due_date">
                </div>
                <div class="form-group">
                    <label for="task-recurrence">Repeat</label>
                    <select id="task-recurrence" name="recurrence">
                        <option value="none">None</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Tags</label>
                <div id="task-tags-list" class="tag-checkboxes"></div>
            </div>
            <div class="modal-actions">
                <button type="button" id="modal-cancel" class="btn btn-outline">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="delete-modal" class="modal-overlay hidden">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h2>Delete Task</h2>
            <button id="delete-modal-close" class="btn-icon" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to delete <strong id="delete-task-name"></strong>?</p>
            <div class="modal-actions">
                <button type="button" id="delete-cancel" class="btn btn-outline">Cancel</button>
                <button type="button" id="delete-confirm" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- Tags Management Modal -->
<div id="tags-modal" class="modal-overlay hidden">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h2>Manage Tags</h2>
            <button id="tags-modal-close" class="btn-icon" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="tags-manager-list"></div>
    </div>
</div>

<!-- Toast notifications -->
<div id="toast-container" class="toast-container"></div>

<script src="/js/app.js"></script>
</body>
</html>
